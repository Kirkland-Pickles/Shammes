name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm.cmd ci

      - name: Run tests
        run: npm.cmd test

      - name: Build installer
        run: npm.cmd run build

      - name: Prepare release files
        id: files
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Release tag must be v$version."
          }

          $name = "Shammes-windows-x64-$version"
          $installer = Get-Item -LiteralPath "dist/$name.exe" -ErrorAction Stop
          $portable = Get-Item -LiteralPath "dist/$name.zip" -ErrorAction Stop

          "installer=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "portable=$($portable.Name)" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            dist/${{ steps.files.outputs.installer }}
            dist/${{ steps.files.outputs.portable }}
          if-no-files-found: error

  attest:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-path: dist/*

  publish:
    needs: attest
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem -LiteralPath "dist" -File | ForEach-Object { $_.FullName })

          gh release create $env:RELEASE_TAG @assets `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title "Shammes $env:RELEASE_TAG" `
            --notes "Built and published by GitHub Actions."
